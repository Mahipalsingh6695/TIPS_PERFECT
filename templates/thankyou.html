<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #fff;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        a {
            text-decoration: none;
            background-color: #ff6f61;
            color: #fff;
            font-size: 1rem;
            padding: 10px 20px;
            border-radius: 25px;
            transition: 0.3s ease;
        }

        a:hover {
            background-color: #ff4a3c;
            transform: scale(1.05);
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.2);
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Thank You!</h1>
        <p>Your responses have been successfully submitted.</p>
        <a href="https://tips-g-alwar-frontend.vercel.app/index.html">Go Back</a>
    </div>
</body>
</html>
